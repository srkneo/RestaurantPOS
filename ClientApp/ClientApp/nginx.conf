server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # In production Caddy sends /api, /health and /orderHub straight to the API; these are for the test setup.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:8080;
  }

  location /orderHub {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Built files have a hash in their name, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The page itself is always checked again, so screens pick up a new version after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    # Only our own scripts run; styles, fonts, images and live updates only from here (and Google Fonts); no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
