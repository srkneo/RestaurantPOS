# Production stack on the server: Caddy (HTTPS) -> web (screens) and api -> PostgreSQL.
# Secrets live in .env next to this file (copy .env.example). POS_VERSION comes from version.env (written by deploy.sh).
name: pos

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d restaurant_pos"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api:
    image: ghcr.io/srkneo/restaurantpos-api:${POS_VERSION:?Run deploy.sh with a version}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Caddy is the only way in, so its X-Forwarded-For and X-Forwarded-Proto headers are trusted.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # At most 40 of the database's 100 connections, so backups and admin can always connect.
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=restaurant_pos;Username=pos;Password=${POSTGRES_PASSWORD};Maximum Pool Size=40"
      Platform__Email: ${PLATFORM_EMAIL:?Set PLATFORM_EMAIL in .env}
      Platform__Password: ${PLATFORM_PASSWORD:?Set PLATFORM_PASSWORD in .env}
      # Empty = the safe defaults (10 sign-ins and 600 requests a minute). Raised only on the load-test server.
      RateLimits__LoginPerMinute: ${RATE_LOGIN_PER_MINUTE:-}
      RateLimits__RequestsPerMinute: ${RATE_REQUESTS_PER_MINUTE:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Alerts__TelegramToken: ${TELEGRAM_TOKEN:-}
      Alerts__TelegramChatId: ${TELEGRAM_CHAT_ID:-}
      DataProtection__KeysPath: /app/keys
      # Shown in the footer and on the About page.
      App__Version: ${POS_VERSION:-}
      # Menu scan (photos of a paper menu). Without a key the scan button explains it is not set up.
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-}
      Gemini__FallbackModel: ${GEMINI_FALLBACK_MODEL:-}
      # Error tracking (Sentry free plan). Empty = off (shop PCs, load-test server).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Traces and metrics (Grafana Cloud, OpenTelemetry). Empty endpoint = off. Headers: Authorization=Basic%20<base64 id:token>
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      TELEMETRY_TRACE_RATIO: ${TELEMETRY_TRACE_RATIO:-}
      # Shop PC licence. Empty = no licence needed (the cloud version). The installer sets these on a shop PC.
      Licence__Required: ${LICENCE_REQUIRED:-}
      Licence__PublicKey: ${LICENCE_PUBLIC_KEY:-}
      Licence__ServerUrl: ${LICENCE_SERVER_URL:-}
      # Only on the cloud server: signs shop licences. Never on a shop PC.
      Licence__PrivateKey: ${LICENCE_PRIVATE_KEY:-}
    volumes:
      - keys:/app/keys
      - applogs:/app/logs
      # Shared with auto-update.sh on a shop PC: "Update now" requests, the update status and the update policy.
      - ./update:/app/update
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    image: ghcr.io/srkneo/restaurantpos-web:${POS_VERSION:?Run deploy.sh with a version}
    restart: unless-stopped
    depends_on:
      - api
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging: *logging

volumes:
  pgdata:
  keys:
  applogs:
  caddy_data:
  caddy_config:
