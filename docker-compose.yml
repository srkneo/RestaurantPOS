name: pos
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_pos"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=restaurant_pos;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      Admin__Email: "${ADMIN_EMAIL:-admin@pos.local}"
      Admin__Password: "${ADMIN_PASSWORD:-ChangeMe#12345}"
      # Test setup only: the E2E tests sign in many times a minute. Production keeps the default of 10.
      RateLimits__LoginPerMinute: "${LOGIN_LIMIT_PER_MINUTE:-1000}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./ClientApp/ClientApp
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
