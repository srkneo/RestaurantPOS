name: Uptime

# Checks the live site every 15 minutes and sends a Telegram message when it is down.
# Set the repository secrets SITE_URL (e.g. https://13-233-10-20.sslip.io), POS_TG_TOKEN and POS_TG_CHAT.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TG_TOKEN: ${{ secrets.POS_TG_TOKEN }}
          TG_CHAT: ${{ secrets.POS_TG_CHAT }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL is not set yet; nothing to check."; exit 0; fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 "$SITE_URL/health/ready" > /dev/null; then echo "Site is up"; exit 0; fi
            sleep 20
          done
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              --data-urlencode text="🔴 RestaurantPOS is DOWN: ${SITE_URL}/health/ready failed 3 times" > /dev/null
          fi
          exit 1
