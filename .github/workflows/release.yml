name: Release

# Push a tag like v1.5.0 to build the images, publish them to GitHub Packages and deploy them.
# Deploy needs these repository secrets (set once the server exists, step V5):
#   DEPLOY_HOST (server IP), DEPLOY_USER (e.g. ubuntu), DEPLOY_SSH_KEY (private key), SITE_URL (https://<ip-with-dashes>.sslip.io)
# Optional: POS_TG_TOKEN and POS_TG_CHAT for a Telegram message after each deploy.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy again (e.g. 1.5.0), images must already exist'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/srkneo/restaurantpos-api:${{ steps.v.outputs.version }}
            ghcr.io/srkneo/restaurantpos-api:latest
          labels: org.opencontainers.image.source=https://github.com/srkneo/RestaurantPOS
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: ClientApp/ClientApp
          push: true
          tags: |
            ghcr.io/srkneo/restaurantpos-web:${{ steps.v.outputs.version }}
            ghcr.io/srkneo/restaurantpos-web:latest
          labels: org.opencontainers.image.source=https://github.com/srkneo/RestaurantPOS
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    if: always() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TG_TOKEN: ${{ secrets.POS_TG_TOKEN }}
      TG_CHAT: ${{ secrets.POS_TG_CHAT }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the server is set up
        id: ready
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::Images are published. No server secrets yet, so nothing was deployed."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH key
        if: steps.ready.outputs.go == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Copy the stack files to the server
        if: steps.ready.outputs.go == 'true'
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/pos'
          scp -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh deploy/restore-test.sh deploy/.env.example \
            "$DEPLOY_USER@$DEPLOY_HOST:~/pos/"
      - name: Pull and start the new version
        if: steps.ready.outputs.go == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token only lives for this job; the server signs in, pulls, then signs out again.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x ~/pos/deploy.sh && ~/pos/deploy.sh '$VERSION'; status=\$?; docker logout ghcr.io; exit \$status"
      - name: Wait until the site answers
        if: steps.ready.outputs.go == 'true' && env.SITE_URL != ''
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$SITE_URL/health/ready" > /dev/null; then echo "Site is up"; exit 0; fi
            sleep 6
          done
          echo "::error::$SITE_URL/health/ready did not answer after 4 minutes"
          exit 1
      - name: Telegram message
        if: always() && steps.ready.outputs.go == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then text="✅ RestaurantPOS $VERSION is live: $SITE_URL"; else text="❌ RestaurantPOS $VERSION deploy FAILED. See GitHub Actions."; fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode text="$text" > /dev/null
