name: Deploy files

# Catches mistakes in the production stack files before a release tag is pushed.
on:
  pull_request:
    paths: ['deploy/**', 'Dockerfile', 'ClientApp/ClientApp/Dockerfile', 'ClientApp/ClientApp/nginx.conf']
  push:
    branches: [master]
    paths: ['deploy/**', 'Dockerfile', 'ClientApp/ClientApp/Dockerfile', 'ClientApp/ClientApp/nginx.conf']

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/; s/^PLATFORM_EMAIL=.*/PLATFORM_EMAIL=a@b.c/; s/^PLATFORM_PASSWORD=.*/PLATFORM_PASSWORD=x/' .env
          echo "POS_VERSION=0.0.0" > version.env
          docker compose --env-file .env --env-file version.env -f docker-compose.prod.yml config --quiet
      - name: Caddyfile is valid
        run: docker run --rm -e SITE_ADDRESS=example.sslip.io -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: deploy.sh has no syntax errors
        run: bash -n deploy/deploy.sh
      - name: Web image builds (nginx settings are valid)
        run: |
          docker build -t pos-web-check ClientApp/ClientApp
          docker run --rm --add-host api:127.0.0.1 pos-web-check nginx -t
      - name: Backup and restore scripts work
        run: |
          bash -n deploy/backup.sh
          bash -n deploy/restore-test.sh
          bash -n deploy/bill-check.sh
          docker run -d --name pos-db-1 -e POSTGRES_USER=pos -e POSTGRES_PASSWORD=x -e POSTGRES_DB=restaurant_pos postgres:17
          for i in $(seq 1 60); do docker exec pos-db-1 pg_isready -h 127.0.0.1 -U pos -d restaurant_pos && break; sleep 2; done
          docker exec pos-db-1 psql -U pos -d restaurant_pos -c '
            CREATE TABLE "Tenants" ("Id" int); INSERT INTO "Tenants" VALUES (1);
            CREATE TABLE "AspNetUsers" ("Id" text); INSERT INTO "AspNetUsers" VALUES ($$u1$$);
            CREATE TABLE "__EFMigrationsHistory" ("MigrationId" varchar(150), "ProductVersion" varchar(32));
            INSERT INTO "__EFMigrationsHistory" VALUES ($$20261114120955_AddPlatformAdmin$$, $$10.0$$);'
          mkdir -p /tmp/pos
          cp deploy/backup.sh deploy/restore-test.sh /tmp/pos/
          bash /tmp/pos/backup.sh
          bash /tmp/pos/restore-test.sh | tee /tmp/restore.txt
          grep -q "restore test passed" /tmp/restore.txt
          docker rm -f pos-db-1
      - name: Caddyfile also works for a shop PC (plain HTTP on the local network)
        run: docker run --rm -e SITE_ADDRESS=:80 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Shop PC installer works end to end (newest released version)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          bash -n deploy/shop-install.sh
          bash -n deploy/licence-keygen.sh
          bash deploy/licence-keygen.sh "$RUNNER_TEMP/licence-keys"
          test -s "$RUNNER_TEMP/licence-keys/licence-private.b64"
          test -s "$RUNNER_TEMP/licence-keys/licence-public.b64"
          # Until the real public key is committed as deploy/licence-public.key, the installer test runs without a licence.
          NO_LIC=""; if [ ! -f deploy/licence-public.key ]; then NO_LIC=1; fi
          # Newer sudo ignores -E, so every setting is passed by name.
          sudo POS_NO_LICENCE="$NO_LIC" GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" POS_FILES_DIR="$PWD/deploy" POS_OWNER_EMAIL=owner@test.local POS_OWNER_PASSWORD='Owner#2026x' bash deploy/shop-install.sh
          sudo grep -q '^ADMIN_PASSWORD=$' /root/pos/.env
          if [ -f deploy/licence-public.key ]; then
            sudo grep -q '^LICENCE_REQUIRED=true$' /root/pos/.env
            sudo grep -q '^LICENCE_PUBLIC_KEY=.' /root/pos/.env
            sudo grep -q '^LICENCE_SERVER_URL=https://' /root/pos/.env
          fi
          sudo crontab -l | grep -q '^0 3 \* \* \* /root/pos/backup.sh'
          # Running it again is an update: settings are kept and the POS still answers.
          sudo POS_NO_LICENCE="$NO_LIC" GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="$GHCR_USER" POS_FILES_DIR="$PWD/deploy" bash deploy/shop-install.sh
          curl -fsS -o /dev/null http://localhost/health
          # The licence settings are replaced, not added twice, when the installer runs again.
          if [ -f deploy/licence-public.key ]; then test "$(sudo grep -c '^LICENCE_REQUIRED=' /root/pos/.env)" = 1; fi
