name: Deploy files

# Catches mistakes in the production stack files before a release tag is pushed.
on:
  pull_request:
    paths: ['deploy/**', 'Dockerfile', 'ClientApp/ClientApp/Dockerfile', 'ClientApp/ClientApp/nginx.conf']
  push:
    branches: [master]
    paths: ['deploy/**', 'Dockerfile', 'ClientApp/ClientApp/Dockerfile', 'ClientApp/ClientApp/nginx.conf']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/; s/^PLATFORM_EMAIL=.*/PLATFORM_EMAIL=a@b.c/; s/^PLATFORM_PASSWORD=.*/PLATFORM_PASSWORD=x/' .env
          echo "POS_VERSION=0.0.0" > version.env
          docker compose --env-file .env --env-file version.env -f docker-compose.prod.yml config --quiet
      - name: Caddyfile is valid
        run: docker run --rm -e SITE_ADDRESS=example.sslip.io -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: deploy.sh has no syntax errors
        run: bash -n deploy/deploy.sh
      - name: Web image builds (nginx settings are valid)
        run: |
          docker build -t pos-web-check ClientApp/ClientApp
          docker run --rm --add-host api:127.0.0.1 pos-web-check nginx -t
      - name: Backup and restore scripts work
        run: |
          bash -n deploy/backup.sh
          bash -n deploy/restore-test.sh
          docker run -d --name pos-db-1 -e POSTGRES_USER=pos -e POSTGRES_PASSWORD=x -e POSTGRES_DB=restaurant_pos postgres:17
          for i in $(seq 1 60); do docker exec pos-db-1 pg_isready -h 127.0.0.1 -U pos -d restaurant_pos && break; sleep 2; done
          docker exec pos-db-1 psql -U pos -d restaurant_pos -c '
            CREATE TABLE "Tenants" ("Id" int); INSERT INTO "Tenants" VALUES (1);
            CREATE TABLE "AspNetUsers" ("Id" text); INSERT INTO "AspNetUsers" VALUES ($$u1$$);
            CREATE TABLE "__EFMigrationsHistory" ("MigrationId" varchar(150), "ProductVersion" varchar(32));
            INSERT INTO "__EFMigrationsHistory" VALUES ($$20261114120955_AddPlatformAdmin$$, $$10.0$$);'
          mkdir -p /tmp/pos
          cp deploy/backup.sh deploy/restore-test.sh /tmp/pos/
          /tmp/pos/backup.sh
          /tmp/pos/restore-test.sh | tee /tmp/restore.txt
          grep -q "restore test passed" /tmp/restore.txt
          docker rm -f pos-db-1
