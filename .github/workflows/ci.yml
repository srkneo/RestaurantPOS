name: CI
on:
  push:
    branches: [master, 'feature/**']
  pull_request:
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test RestaurantPOS.Tests
      # SEC3: a package with a known high or critical security hole fails the build.
      - name: Vulnerable NuGet packages
        run: |
          dotnet list RestaurantPOS.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE "\b(High|Critical)\b" vulnerable.txt; then echo "High or critical vulnerable NuGet package found"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm run build && npm test
        working-directory: ClientApp/ClientApp
      - name: Vulnerable npm packages
        run: npm audit --omit=dev --audit-level=high
        working-directory: ClientApp/ClientApp
